[project]
name = "tumblr-likes"
version = "0.1.0"
description = "Tumblr Likes Browser - Flask app for browsing and searching liked Tumblr posts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch==6.3.1",
    "elasticsearch-dsl==6.2.1",
    "Flask==1.0.2",
    "humanize==3.14.0",
    "Jinja2==2.10",
    "pyquery==1.4.3",
    "python-dateutil==2.9.0",
    "pytumblr==0.0.8",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "autopep8==1.4.1",
    "isort==4.3.4",
    "pylint==2.1.1",
]
